name: Keep the check on

# GitHub switches off scheduled workflows in a public repository after 60
# days without a commit. Once a month this commits the date, so the uptime
# check is never switched off by itself.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Commit the date
        shell: bash
        run: |
          date -u '+%Y-%m-%d' > last-alive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-alive.txt
          git commit -m "Keep the uptime check on ($(date -u '+%Y-%m-%d'))" || exit 0
          git push
